<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c2217" />
      <stop offset="100%" stop-color="#143d2b" />
    </linearGradient>
    <linearGradient id="bookTeal" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d1a7" />
      <stop offset="100%" stop-color="#00a884" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#d4a359" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Open Book Emblem -->
  <g transform="translate(6, 7)">
    <!-- Outer Book Frame (Spine & Underline Bar) -->
    <path 
      d="M 6 12 L 6 42 C 6 45 8 47 11 47 L 40 47 L 40 41 L 12 41 C 11.5 41 11 40.5 11 40 L 11 14 L 6 12 Z" 
      fill="url(#bookTeal)" 
    />
    <!-- Top Open Pages Arch -->
    <path 
      d="M 6 12 C 13 8 21 10 26 16 C 31 10 39 8 46 12 L 46 18 C 39 14 31 16 26 21 C 21 16 13 14 6 18 Z" 
      fill="url(#bookTeal)" 
    />
    <!-- Golden Accent Pages -->
    <path 
      d="M 14 22 Q 20 18 26 24 Q 32 18 38 22" 
      stroke="#d4a359" 
      stroke-width="2" 
      stroke-linecap="round" 
      fill="none" 
      opacity="0.9"
    />
  </g>
</svg>
