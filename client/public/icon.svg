<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ilmGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#ilmGrad)" />

  <!-- Open Book Symbol -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path
      d="M32 46C26 42 18 42 14 43V21C18 20 26 20 32 24V46Z"
      fill="#FFFFFF"
    />
    <!-- Right Page -->
    <path
      d="M32 46C38 42 46 42 50 43V21C46 20 38 20 32 24V46Z"
      fill="#E6FFFA"
    />
    <!-- Spine Line -->
    <path
      d="M32 24V46"
      stroke="#047857"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <!-- Text Lines on Left Page -->
    <path
      d="M18 27C22 26.5 26 26.5 28 28.5M18 33C22 32.5 26 32.5 28 34.5M18 39C22 38.5 26 38.5 28 40.5"
      stroke="#10B981"
      stroke-width="1.2"
      stroke-linecap="round"
    />
    <!-- Text Lines on Right Page -->
    <path
      d="M46 27C42 26.5 38 26.5 36 28.5M46 33C42 32.5 38 32.5 36 34.5M46 39C42 38.5 38 38.5 36 40.5"
      stroke="#10B981"
      stroke-width="1.2"
      stroke-linecap="round"
    />
    <!-- Star / Beacon on top -->
    <circle cx="32" cy="15" r="2.5" fill="#FBBF24" />
  </g>
</svg>

