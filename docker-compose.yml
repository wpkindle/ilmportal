version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ilmportal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ilmportal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/pakistan_lms
      - JWT_SECRET=production_secret_key_ilmportal_pk_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    volumes:
      - ./server/src/uploads:/app/src/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ilmportal-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
